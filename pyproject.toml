[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "psi-agent"
dynamic = ["version"]
description = "A microkernel-style agent framework"
readme = "README.md"
authors = [{name = "Hao Zhang", email = "hzhangxyz@outlook.com"}]
license = {text = "MIT"}
requires-python = ">=3.14"
dependencies = [
    "anyio>=4.14.2",
    "aiohttp>=3.14.3",
    "loguru>=0.7.3",
    "tyro>=1.0.15",
    "croniter>=6.2.4",
    "pyyaml>=6.0.3",
    "prompt-toolkit>=3.0.52",
    "rich>=15.0.0",
    # 上界是承重的, 且必须卡到 minor: any-llm 会在 minor 版本里改**请求语义**。
    # 实测 1.21.0 的 providers/deepseek/deepseek.py 没有 thinking 分支, 1.26.0
    # 有 —— 它把 reasoning_effort 缺省值当「没要思维」, 下发
    # extra_body.thinking={"type":"disabled"}, 于是模型把自我对话写进 content
    # (线上的 thinking 泄漏)。原先写 >=1.21.0 开区间, 这个变更就静默上了线。
    #
    # 所以 <2.0.0 这种 semver 上界在这里没用: 1.21→1.26 本身就是 minor。要拦住
    # 这一类, 上界只能卡 minor, 升级时人工读 changelog。
    #
    # 下界同时抬到 1.26.0 对齐生产: 之前 lock 是 1.21.0 而生产镜像跑 1.26.0,
    # 本机与线上不在同一条 minor 线上 —— 这正是该变更没被本机测试发现的原因。
    "any-llm-sdk>=1.26.0,<1.27.0",
    "json-repair>=0.63.0,<0.64",
    "platformdirs>=4.10.1",
    "keyring>=25.0.0",
    "lark-channel-sdk>=1.2.0",
    "python-telegram-bot[socks]>=22.8",
    # Upper bound is load-bearing: mcp 2.0 removed the lowlevel
    # ``@server.list_tools()`` / ``@server.call_tool()`` decorators that
    # serper-mcp-server applies at import time, so an unbounded resolve to 2.x
    # makes ``import serper_mcp_server`` raise AttributeError and takes every
    # search down. Upstream recommends pinning below 2 until callers migrate. We
    # only use mcp's *client* APIs, so 1.x costs us nothing.
    "mcp>=1.28.1,<2.0.0",
    "serper-mcp-server>=0.0.10",
    "pystray>=0.19.5",
    "pillow>=12.3.0",
    "pymupdf>=1.28.0",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "openpyxl>=3.1.5",
    "readability-lxml>=0.8.4.1",
    "markdownify>=1.2.3",
    "pywebview>=6.2.1",
    "pygount>=3.2.0",
    "hikari>=2.5.0",
    "matplotlib>=3.11.0",
    "antlr4-python3-runtime>=4.13.2,<4.14",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.22",
    "ty>=0.0.61",
]

[project.scripts]
psi-agent = "psi_agent.cli:main"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.sdist]
artifacts = [
    "src/psi_agent/gateway/spa/dist/**/*",
    "src/psi_agent/gateway/spa-v2/dist/**/*",
]
exclude = [
    "src/psi_agent/gateway/spa/node_modules/**",
    "src/psi_agent/gateway/spa-v2/node_modules/**",
]

[tool.hatch.build.targets.wheel]
packages = ["src/psi_agent"]
exclude = [
    "src/psi_agent/**/AGENTS.md",
    "src/psi_agent/**/.gitignore",
    "src/psi_agent/gateway/spa",
    "src/psi_agent/gateway/spa-v2",
]
artifacts = [
    "src/psi_agent/gateway/spa/dist/**/*",
    "src/psi_agent/gateway/spa-v2/dist/**/*",
]

[tool.ruff]
target-version = "py314"
line-length = 120
extend-exclude = ["examples/haitun-workspace/skills/workflow/fusion_flow/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "ASYNC", "SIM", "C4", "B", "RUF", "N", "T20", "PLC"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = ["--strict-markers", "-ra", "--cov"]
markers = ["schedule: schedule-based tests (> 30s)"]

[tool.ty.environment]
extra-paths = ["examples/haitun-workspace/skills/workflow"]

[tool.ty.src]
exclude = ["examples/haitun-workspace/skills/workflow/fusion_flow/generated"]

[tool.coverage.run]
source = ["src/psi_agent"]
