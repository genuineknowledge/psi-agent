# 公司会议 SOP —— 可编辑的判定口径（周中对齐会，v1.1）
# skills 与 tools 的判定要求一律读本文件，不要写死在 SKILL.md / 代码里。
# 换一家公司 / 换一场会议 = 替换或新增本文件；引擎（分析纪律、四态判定、注入与告警）零改动。
# 字段名与结构是契约，不要改（引擎 / 工具按字段名读取）；只改值（rules 条目内容可按口径增删改）。
#
# v1.1 (2026-09-09 定稿，依据《真知周中对齐会 SOP》v1.1 docx「核心原则」)：
#   核心原则编号 1/3/4/5 四条已 agent 化生效：
#     1  msop.core.01  必有产出（决定、行动项、负责人、截止时间；拒绝无结论的会）
#     3  msop.core.03  会中控制时间（总时长 ≤30 分钟，每人发言 ≤3 分钟）
#     4  msop.core.04  会后纪要与闭环执行（行动项验收与闭环在下次会议开始之前）
#     5  msop.core.05  杜绝流水账（发言是讲问题、偏差、下一步，不是报菜名）
#   核心原则 2（会前准备落实到责任人）不在本判定引擎范围：其证据在会前（组长查 TODO、
#   成员会前梳理），单靠会中转写无法独立取证，待 TODO 数据通道接入后另行 agent 化，
#   故 msop.core.02 保持 active: false。
#   核心原则 6（频次与时长随团队成熟逐步降低直到取消）属发起/降级机制，由后续 SOP
#   另行规定，不作为转写判定条目。
# 判定标准/示例由 SOP v1.1 原文条款改写，作为引擎判定的口径底线；输出仍以原文
# 转写为事实证据，口径文本本身不是证据。生效条目的标准正文一旦改动即需升版本。

meta:
  version: v1.1
  sop_name: 周中对齐会会议 SOP
  scope_meetings: [weekday-alignment, weekday-alignment-1100]
  updated_at: 2026-09-09

# 观察面：SOP 符合性检查按这三个面归组逐条给出 judgment_states 之一，并附原文依据。
observation_axes:
  - id: prep
    title: 会前准备
  - id: session
    title: 会中议题与决议
  - id: followup
    title: 会后跟进闭环

# 判定四态：引擎只允许这四种输出，不允许"默认通过"。
judgment_states:
  - 符合
  - 部分符合
  - 不符合
  - 证据不足

# 会议 SOP 业务条目：每条一个稳定 ID（msop.*），供分析输出与卡片闭环引用。
# active: true 的条目由引擎逐条判定（注入时附机器渲染的「生效判定清单」）；
# active: false 的条目模型不得判 符合/部分符合/不符合，一律按"证据不足/待补充证据"。
rules:
  - id: msop.core.01
    active: true
    title: 必有产出（核心原则 1）
    axis: session
    criteria: |
      依据 SOP v1.1「核心原则 1」必有产出：每次会议产出决定、行动项、负责人和截止时间，
      拒绝无结论的会。判定要点：
      1) 对讨论过的议题有结论（拍板/取舍/明确下一步），不是讨论完就翻篇；
      2) 有行动项，且每个行动项能辨明 负责人（谁）与 截止时间（何时，如具体日期/时点）；
      3) 行动项与"进 TODO List、下次会前闭环"衔接（见 msop.core.04）。
      结论集合完全缺失 → 不符合；只缺个别要素（如只缺截止时间）→ 部分符合。
    compliant_example: |
      会尾明确出现结论："方向定了，先做 A；行动项：A 由张浩负责，周三 18:00 前交初稿；
      B 由李四负责，周四会前完成调研并进 TODO"。
    violation_example: |
      全场讨论完无总结、无结论，主持人说"这个我们下次再聊"即散会；
      或行动项只有事项描述，全场听不出谁负责、何时完成。
    exception: |
      产出的唯一证据是原文明确出现的表述；"我来做，明天给你"这类自然语言也算，但必须
      能辨明 谁 + 何时。含混到无法辨明 → 该条记"证据不足"，不得臆测补全；
      一次性决策类议题当场有明确结论即可视为产出，不必然产生 TODO 行动项。
  - id: msop.core.02
    active: false
    title: 会前准备落实到责任人（核心原则 2）
    axis: prep
    criteria: ""        # 证据在会前（组长查 TODO/成员会前梳理），转写引擎无法独立取证 → 未生效（见文件头说明）
    compliant_example: ""
    violation_example: ""
    exception: ""
  - id: msop.core.03
    active: true
    title: 会中控制时间（核心原则 3）
    axis: session
    criteria: |
      依据 SOP v1.1「核心原则 3」「会中·议程」：总时长不超过 30 分钟，每人发言不超过
      3 分钟。判定要点：
      1) 按议程顺序推进：议程一（行动项复查 + 进展总结）≤5 分钟、议程二（逐人点评）
         ≤5 分钟、议程三（成员逐个发言）每人 ≤3 分钟，整场时间跨度 ≤30 分钟；
      2) 超时出现打断与分流（主持人切断并转"会后单独聊"）视为执行了时间控制；
      3) 时间戳缺失或无法对应到人 → 时长判定一律"证据不足"，不得凭文本篇幅猜测。
    compliant_example: |
      转写时间戳显示整场约 26 分钟；某成员发言偏长时主持人说"先到这里，已经超过
      3 分钟，这个问题会后单独聊"，随后切到下一人。
    violation_example: |
      时间戳证据充分时整场明显超过 30 分钟；或某成员连续发言明显超过 3 分钟
      且无人打断、无人分流。
    exception: |
      30 分钟是理想目标而非硬性截断：为保障信息对齐完整而适当延长、但议程走完，
      不判不符合；为卡时间打断关键讨论同样不被鼓励（负责人优先保障信息对齐完整，
      其次控制时长）。纯文本长度不能作为超时证据。
  - id: msop.core.04
    active: true
    title: 会后纪要与闭环执行（核心原则 4）
    axis: followup
    criteria: |
      依据 SOP v1.1「核心原则 4」「会后·必须项」「议程一」：会议的行动项需要完成验收和
      闭环，在下次会议开始之前进行；每位成员把本人行动项（做什么 + 截止时间）更新到
      自己的 TODO List（TODO List 是行动项追踪的唯一依据）。转写内可观察锚点：
      1) 会尾是否明确"更新 TODO/进 TODO"的安排（含做什么与截止）；
      2) 后续场次（同会议号跨场次复查）开场是否对上次行动项给出验收陈述（完成/未完成
         及原因），体现闭环发生在下次会前。
    compliant_example: |
      会尾成员/主持人说"这条进我的 TODO，周四晚前做完"；跨场次开场出现"上次那条 X
      已完成 / 未闭环，卡在 Y，原因…"的复查验收。
    violation_example: |
      产生行动项后无人提 TODO、无人提截止；或连续场次开场完全不复查上次行动项；
      行动项跨场次既无进展也无说明。
    exception: |
      会后动作是否真实发生无法由本场转写证实：以会内可观察的 TODO 安排与跨场次复查
      锚点为准；两个锚点都观察不到 → 记"证据不足"，留给下一场复查确认；
      规则生效后的首场、确实没有上次行动项可复查时，不判不符合。
  - id: msop.core.05
    active: true
    title: 杜绝流水账（核心原则 5）
    axis: session
    criteria: |
      依据 SOP v1.1「核心原则 5」「议程一」「议程三」：发言不是报菜名，是讲问题、偏差、
      下一步。判定要点：
      1) 议程三成员发言按 效果与成果 / 困难点 / 做得好 / 做得差 的结构组织，第一句
         发言不能是"做了什么"式的流水账；
      2) 议程一总结须说清进展与 Technology-Product-Market Fit 方向的关系（更近/更远、
         偏差在哪里），不只罗列完成事项；
      3) 判断针对整段发言：偶有一句列举不算流水账；自由讨论/答疑片段不适用本条。
    compliant_example: |
      成员开口即讲"本周在用户侧的目标效果是 X，困难点是 Y，下一步…"；
      议程一总结："按市场反馈，我们离 TPMF 更近了一步，因为…，偏差在…"。
    violation_example: |
      成员以"我做了 A、B、C、D"开头逐条报完即止，全场无问题、无偏差、无下一步；
      负责人总结只重复大家做了什么，不与市场 / TPMF 挂钩。
    exception: |
      无法从转写确认是否含困难/偏差表述时以字面证据为准；明显的列举式汇报且无结论
      可判"部分符合"；本条只适用于汇报/总结环节的发言段落。
