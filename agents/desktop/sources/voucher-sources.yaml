    url: "https://commerce.ah.gov.cn/ztzl/2024gdzfxfqgg/"
    verified_at: "2026-09-17"
    why: "页面真实可抓, 但栏目名是「**2024**各地政府消费券公告」—— 过期栏目; 正文「家电」0 次、「满」0 次, 只有栏目壳"
  - target: 安徽省商务厅首页
    url: "https://commerce.ah.gov.cn/"
    verified_at: "2026-09-18"
    why: "首页「消费券」命中 0 次, 没有可用的消费券栏目入口"
  - target: 合肥市政府门户
    url: "https://www.hefei.gov.cn/"
    verified_at: "2026-09-18"
    why: "抓取失败（连接层）, 未能取证"
  - target: 中国银联 / 云闪付优惠
    url: "https://youhui.95516.com/"
    verified_at: "2026-09-18"
    why: "抓取失败; 政府消费券专区在 App 内, 没有可用的网页入口"
  - target: 商务部 · 线上促消费列表接口
    url: "https://dzswgf.mofcom.gov.cn/ecps/sale/list"
    verified_at: "2026-09-18"
    why: "抓取失败（疑似 POST-only）; 用 saleinfo/pageN.html 即可"

