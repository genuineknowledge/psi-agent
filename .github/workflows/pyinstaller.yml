name: PyInstaller

# 这条流水线有两个身份:
#   1. 跨平台可编译性的兜底 —— 三平台全编, 编不过这里先红 (nuitka.yml 只在发版
#      时才编, 不承担这个职责);
#   2. OSS 发版通道的上游 —— `haitun-inno-setup` 产出的
#      `haitun-agent-installers` 由 oss-publish.yml 消费。
#
# 触发面保持宽口径 (任何分支的任何推送 + PR): 兜底职责要求编得越勤越好, 收窄
# 会让特性分支上的编译问题拖到开 PR 才暴露。
#
# 接成 oss-publish.yml 的上游不需要在这里收窄: 下游自己在 `workflow_run` 上有
# `branches: [main, v*]` 过滤, 特性分支和 PR 的 run 根本到不了它, 再加 job 级的
# `head_branch == 'main'` 做第二道闸。管住发布面的是下游, 不是这里。
on:
  push:
  pull_request:

jobs:
  pyinstaller:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      PYINSTALLER_COMMON_FLAGS: >-
        --onefile
        --name psi-agent
        --distpath pyinstaller-dist
        --add-data src/psi_agent/gateway/spa/dist:psi_agent/gateway/spa/dist
        --add-data src/psi_agent/gateway/spa-v2/dist:psi_agent/gateway/spa-v2/dist
        --collect-submodules any_llm
        --collect-submodules mcp
        --collect-submodules serper_mcp_server
        --collect-submodules pystray
        --collect-submodules webview
        --collect-submodules fitz
        --collect-submodules docx
        --collect-submodules pptx
        --collect-submodules openpyxl
        --collect-submodules readability
        --collect-submodules markdownify
        --collect-submodules pygount
        --collect-submodules pygments
        --collect-submodules git
        --collect-submodules chardet
        --collect-submodules hikari
        --collect-submodules matplotlib
        --collect-submodules antlr4
        --collect-submodules json_repair
        --collect-submodules keyring
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - run: uv sync
      # 协议 HTML 是 spa-v2/legal/ 下两份 md 的生成物, 入库以免 build 与 installer 两个 job 都要跑生成器。
      # 这一步防的是「改了 md 忘了重新生成」—— 那会让安装器与产品内展示过时协议。
      - name: Check legal HTML is in sync with docs
        run: uv run python scripts/gen_legal_html.py --check
      - run: uv pip install pyinstaller "mcp[cli,rich,ws]" "any-llm-sdk[all]"
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - run: npm ci
        working-directory: src/psi_agent/gateway/spa
      - run: npm run build
        working-directory: src/psi_agent/gateway/spa
      - run: npm ci
        working-directory: src/psi_agent/gateway/spa-v2
      - run: npm run build
        working-directory: src/psi_agent/gateway/spa-v2
      - shell: bash
        run: uv run pyinstaller $PYINSTALLER_COMMON_FLAGS src/psi_agent/cli.py
      - uses: actions/upload-artifact@v7
        with:
          name: psi-agent-pyinstaller-${{ matrix.os }}
          path: pyinstaller-dist/psi-agent
        if: matrix.os != 'windows-latest'
      - uses: actions/upload-artifact@v7
        with:
          name: psi-agent-pyinstaller-${{ matrix.os }}
          path: pyinstaller-dist/psi-agent.exe
        if: matrix.os == 'windows-latest'

  haitun-inno-setup:
    needs: pyinstaller
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: psi-agent-pyinstaller-windows-latest
          path: dist-exe
      - shell: cmd
        run: copy dist-exe\psi-agent.exe "examples\haitun-workspace\psi-agent.exe"
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MSYS
          release: true
          update: true
          install: >-
            bash coreutils grep sed gawk findutils diffutils which
            git openssh curl rsync tar gzip less nano
            mingw-w64-ucrt-x86_64-nodejs mingw-w64-ucrt-x86_64-uv
      - shell: pwsh
        run: |
          robocopy "${{ steps.msys2.outputs.msys2-location }}" "examples\haitun-workspace\msys64" /E /NFL /NDL /NJH /NJS /NP
          if ($LASTEXITCODE -ge 8) { exit 1 } else { exit 0 }
      - shell: pwsh
        run: Remove-Item -Recurse -Force "examples\haitun-workspace\msys64\var\cache\pacman\pkg\*" -ErrorAction SilentlyContinue
      - run: choco install innosetup --no-progress
      - name: Build launcher with updater config
        shell: pwsh
        env:
          HAITUN_DOWNLOAD_BASE_URL: ${{ vars.HAITUN_DOWNLOAD_BASE_URL }}
          HAITUN_UPDATE_INTERVAL_HOURS: ${{ vars.HAITUN_UPDATE_INTERVAL_HOURS }}
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments "-arch=amd64"
          & ".github\inno-setup\build-haitun-launcher.ps1"
      - name: Inject runtime .env
        shell: pwsh
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: |
          # 只把 key 写进打包目录，不落库；PR 分支没有 secret 时生成空 .env，打包照常成功。
          $path = "examples\haitun-workspace\.env"
          $lines = [System.Collections.Generic.List[string]]::new()
          if ($env:SERPER_API_KEY) {
            $lines.Add("SERPER_API_KEY=$env:SERPER_API_KEY")
          }
          [System.IO.File]::WriteAllText($path, ($lines -join "`r`n"), [System.Text.UTF8Encoding]::new($false))
          Write-Output "runtime .env prepared (SERPER_API_KEY present: $([bool]$env:SERPER_API_KEY))"
      - shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/ChineseSimplified.isl" -OutFile ".github\inno-setup\ChineseSimplified.isl"
      - name: Compute MSYS fingerprint
        shell: pwsh
        run: |
          $fp = & ".github\inno-setup\compute-msys-fingerprint.ps1" -MsysDir "examples\haitun-workspace\msys64"
          Set-Content -LiteralPath "examples\haitun-workspace\msys64\msys-version.txt" -Value $fp -Encoding UTF8 -NoNewline
          Write-Output "MSYS_FINGERPRINT=$fp" >> $env:GITHUB_ENV
      - name: Build installers
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc /Qp /DMSYS_FINGERPRINT="$env:MSYS_FINGERPRINT" /O"installer-output" ".github\inno-setup\haitun.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $iscc /Qp /DCOMPONENT_APP /O"installer-output" ".github\inno-setup\haitun.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $iscc /Qp /DCOMPONENT_MSYS /DMSYS_FINGERPRINT="$env:MSYS_FINGERPRINT" /O"installer-output" ".github\inno-setup\haitun.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Collect version files
        shell: pwsh
        run: |
          Copy-Item -Force "examples\haitun-workspace\haitun-version.txt" "installer-output\"
          Copy-Item -Force "examples\haitun-workspace\msys64\msys-version.txt" "installer-output\"
      - uses: actions/upload-artifact@v7
        with:
          name: haitun-agent-installers
          path: installer-output

  # macOS 侧的组装环节, 对应 Windows 的 `haitun-inno-setup`。
  #
  # 编译器同样走 PyInstaller 而非 Nuitka: 除了 17 min vs 2 h 那笔账 (见文件头),
  # 签名与公证要反复调试, 两小时一轮的反馈周期不可接受。
  #
  # 签名/公证按 **secret 有无自动开关**: 证书还在申请, 没配就产出未签名 dmg
  # (用户需手动绕 Gatekeeper), 证书到位后只加 secrets, 这里和脚本都不用改。
  haitun-macos-dmg:
    needs: pyinstaller
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: psi-agent-pyinstaller-macos-latest
          path: dist-bin
      - name: Inject runtime .env
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: |
          # 与 Windows 侧同一套做法: 只写进打包目录, 不落库; PR 分支没有 secret
          # 时生成空 .env, 打包照常成功。
          if [ -n "$SERPER_API_KEY" ]; then
            printf 'SERPER_API_KEY=%s\n' "$SERPER_API_KEY" > examples/haitun-workspace/.env
          else
            : > examples/haitun-workspace/.env
          fi
          echo "runtime .env prepared (SERPER_API_KEY present: ${SERPER_API_KEY:+yes})"
      # 公证只在发布路径上跑。这条流水线是宽口径的(任何分支的推送 + PR), 而公证
      # 是**同步等 Apple 队列**: 实测排到 45 min 仍 In Progress。若每个分支推送
      # 都等一次, 打包 job 会长期占着 macOS runner 且动辄红在超时上, 而超时和
      # "包有问题"完全是两回事。
      #
      # 判据与 nuitka.yml / oss-publish.yml 一致: 只有 main 和 v* tag 才是发版。
      # 特性分支照旧产出**签名但未公证**的 dmg —— 签名是本地几秒的事, 跨平台可
      # 编译性和签名链路仍然每次都验, 只是不排那个队。
      #
      # 排除 alpha tag: `auto-alpha-tag.yml` 每天在 main 的最后一个绿色 commit 上
      # 打一个 `v*-alphaYYYYMMDD`, 用途是发 PyPI, 与安装器发版无关(安装器看
      # haitun.iss)。而 tag 指向的 commit 推 main 时已经公证过一遍, 再排一次队是
      # 纯浪费 —— macOS runner 按 10 倍计费, 45 min 等待≈450 计费分钟/天。
      - name: Decide whether to notarize
        id: notarize
        shell: bash
        run: |
          enabled=false
          case "$GITHUB_REF" in
            refs/heads/main) enabled=true ;;
            # alpha tag 走 PyPI, 不是安装器发版; 内容已随 main 公证过
            refs/tags/v*-alpha*) enabled=false ;;
            refs/tags/v*) enabled=true ;;
            *) enabled=false ;;
          esac
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          if [ "$enabled" = "true" ]; then
            echo "::notice::发布路径 ($GITHUB_REF), 将提交公证"
          else
            echo "::notice::非发布路径 ($GITHUB_REF), 只签名不公证"
          fi
      - name: Build dmg
        env:
          PSI_AGENT_BIN: dist-bin/psi-agent
          HAITUN_NOTARIZE: ${{ steps.notarize.outputs.enabled }}
          HAITUN_DOWNLOAD_BASE_URL: ${{ vars.HAITUN_DOWNLOAD_BASE_URL }}
          HAITUN_UPDATE_INTERVAL_HOURS: ${{ vars.HAITUN_UPDATE_INTERVAL_HOURS }}
          P12_CERTIFICATE: ${{ secrets.P12_CERTIFICATE }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          MACOS_KEYCHAIN_PWD: ${{ secrets.MACOS_KEYCHAIN_PWD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          chmod +x dist-bin/psi-agent
          bash .github/macos/build-dmg.sh
      - uses: actions/upload-artifact@v7
        with:
          name: haitun-agent-macos
          path: |
            macos-dist/HaiTun_Agent.dmg
            macos-dist/haitun-version.txt
