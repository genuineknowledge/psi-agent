name: PyInstaller

on:
  push:
  pull_request:

jobs:
  pyinstaller:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    env:
      PYINSTALLER_COMMON_FLAGS: >-
        --onefile
        --name psi-agent
        --distpath pyinstaller-dist
        --add-data src/psi_agent/gateway/spa/dist:psi_agent/gateway/spa/dist
        --add-data src/psi_agent/gateway/spa-v2/dist:psi_agent/gateway/spa-v2/dist
        --collect-submodules any_llm
        --collect-submodules mcp
        --collect-submodules serper_mcp_server
        --collect-submodules pystray
        --collect-submodules webview
        --collect-submodules fitz
        --collect-submodules docx
        --collect-submodules pptx
        --collect-submodules openpyxl
        --collect-submodules readability
        --collect-submodules markdownify
        --collect-submodules pygount
        --collect-submodules pygments
        --collect-submodules git
        --collect-submodules chardet
        --collect-submodules hikari
        --collect-submodules antlr4
        --collect-submodules psi_agent.workflow_graph
        --hidden-import psi_agent.workflow_execution
        --collect-submodules matplotlib
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - run: uv sync
      - run: uv pip install pyinstaller "mcp[cli,rich,ws]" "any-llm-sdk[all]"
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - run: npm ci
        working-directory: src/psi_agent/gateway/spa
      - run: npm run build
        working-directory: src/psi_agent/gateway/spa
      - run: npm ci
        working-directory: src/psi_agent/gateway/spa-v2
      - run: npm run build
        working-directory: src/psi_agent/gateway/spa-v2
      - shell: bash
        run: uv run pyinstaller $PYINSTALLER_COMMON_FLAGS src/psi_agent/cli.py
      - name: Smoke test packaged CLI
        shell: pwsh
        run: |
          pyinstaller-dist/psi-agent.exe --help
          $stdout = Join-Path $env:RUNNER_TEMP "psi-agent-session.out"
          $stderr = Join-Path $env:RUNNER_TEMP "psi-agent-session.err"
          $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
          $listener.Start()
          $port = $listener.LocalEndpoint.Port
          $listener.Stop()
          $process = $null
          try {
            $process = Start-Process `
              -FilePath "pyinstaller-dist/psi-agent.exe" `
              -ArgumentList @(
                "session",
                "--workspace", "examples/haitun-workspace",
                "--ai-socket", "http://127.0.0.1:65534",
                "--channel-socket", "http://127.0.0.1:$port",
                "--verbose"
              ) `
              -RedirectStandardOutput $stdout `
              -RedirectStandardError $stderr `
              -PassThru

            $ready = $false
            for ($attempt = 0; $attempt -lt 90; $attempt++) {
              if ($process.HasExited) { break }
              $logs = Get-Content -Path $stdout, $stderr -ErrorAction SilentlyContinue
              $runnerLoaded = $logs -match "Loaded tool: 'run_flow'"
              $serverListening = $logs -match "Session server listening"
              if ($runnerLoaded -and $serverListening) {
                $ready = $true
                break
              }
              Start-Sleep -Seconds 1
            }

            $logs = Get-Content -Path $stdout, $stderr -ErrorAction SilentlyContinue
            $logs
            if (-not $ready) {
              throw "Packaged Session did not register run_flow and start its server"
            }
          }
          finally {
            if ($null -ne $process -and -not $process.HasExited) {
              taskkill /PID $process.Id /T /F | Out-Null
            }
          }
      - uses: actions/upload-artifact@v7
        with:
          name: psi-agent-pyinstaller-${{ matrix.os }}
          path: pyinstaller-dist/psi-agent
        if: matrix.os != 'windows-latest'
      - uses: actions/upload-artifact@v7
        with:
          name: psi-agent-pyinstaller-${{ matrix.os }}
          path: pyinstaller-dist/psi-agent.exe
        if: matrix.os == 'windows-latest'

  haitun-inno-setup:
    needs: pyinstaller
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify Fusion Flow installer payload
        shell: pwsh
        run: |
          $skill = "examples/haitun-workspace/skills/fusion-flow"
          if (-not (Test-Path "$skill/grammar/FusionFlow.g4")) { throw "FusionFlow grammar is missing" }
          if (-not (Test-Path "$skill/fusion_flow/workflow_runner.py")) { throw "FusionFlow runner is missing" }
          if (Test-Path "$skill/fusion_flow_next") { throw "legacy duplicate FusionFlow package remains" }
          if (-not (Test-Path "examples/haitun-workspace/tools/run_flow.py")) { throw "run_flow tool is missing" }
          if (Test-Path "examples/haitun-workspace/skills/fusion-flow-next") { throw "duplicate FusionFlow skill remains" }
          if (Test-Path "examples/haitun-workspace/tools/flow_run.py") { throw "legacy flow_run tool remains" }
          if (Test-Path "$skill/package.json") { throw "legacy Node runtime remains" }
      - uses: actions/download-artifact@v8
        with:
          name: psi-agent-pyinstaller-windows-latest
          path: dist-exe
      - shell: cmd
        run: copy dist-exe\psi-agent.exe "examples\haitun-workspace\psi-agent.exe"
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MSYS
          release: true
          update: true
          install: >-
            bash coreutils grep sed gawk findutils diffutils which
            git openssh curl rsync tar gzip less nano
            mingw-w64-ucrt-x86_64-nodejs mingw-w64-ucrt-x86_64-uv
      - shell: pwsh
        run: |
          robocopy "${{ steps.msys2.outputs.msys2-location }}" "examples\haitun-workspace\msys64" /E /NFL /NDL /NJH /NJS /NP
          if ($LASTEXITCODE -ge 8) { exit 1 } else { exit 0 }
      - shell: pwsh
        run: Remove-Item -Recurse -Force "examples\haitun-workspace\msys64\var\cache\pacman\pkg\*" -ErrorAction SilentlyContinue
      - run: choco install innosetup --no-progress
      - shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments "-arch=amd64"
          rc /nologo ".github\inno-setup\haitun.rc"
          cl /nologo /O2 ".github\inno-setup\haitun.c" ".github\inno-setup\haitun.res" /Fe:".github\inno-setup\haitun.exe" /link /SUBSYSTEM:WINDOWS user32.lib shell32.lib
      - shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/ChineseSimplified.isl" -OutFile ".github\inno-setup\ChineseSimplified.isl"
      - shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp /O"installer-output" ".github\inno-setup\haitun.iss"'
      - uses: actions/upload-artifact@v7
        with:
          name: haitun-agent-installer-pyinstaller
          path: installer-output/HaiTun Agent Setup.exe
