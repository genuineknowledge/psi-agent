name: CI

on:
  push:
  pull_request:

jobs:
  generated-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "11"
      - name: Download ANTLR 4.13.2
        run: |
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/antlr-4.13.2-complete.jar" \
            https://www.antlr.org/download/antlr-4.13.2-complete.jar
          echo "eae2dfa119a64327444672aff63e9ec35a20180dc5b8090b7a6ab85125df4d76  $RUNNER_TEMP/antlr-4.13.2-complete.jar" \
            | sha256sum --check
      - name: Verify FusionFlow generated sources
        working-directory: examples/haitun-workspace/skills/fusion-flow
        run: |
          output="$RUNNER_TEMP/fusion-flow-generated"
          mkdir "$output"
          java -jar "$RUNNER_TEMP/antlr-4.13.2-complete.jar" \
            -Dlanguage=Python3 -no-listener -Xexact-output-dir \
            -o "$output" grammar/FusionFlow.g4
          diff -u fusion_flow/generated/FusionFlowLexer.py "$output/FusionFlowLexer.py"
          diff -u fusion_flow/generated/FusionFlowParser.py "$output/FusionFlowParser.py"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check .

  fusion-flow-test:
    needs: [generated-sources, lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - run: uv sync
      - name: Test FusionFlow
        working-directory: examples/haitun-workspace/skills/fusion-flow
        run: uv run python -m pytest -q --rootdir=. test

  coscientist-ows-bundle:
    needs: fusion-flow-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build workspace overlay
        run: |
          mkdir -p dist
          archive="dist/coscientist-ows-${GITHUB_SHA}.tar.gz"
          tar -C examples/haitun-workspace -czf "$archive" \
            flows/workflows/coscientist-ows \
            skills/coscientist-ows-entry \
            skills/mattergen-structure-sampler \
            skills/mattersim-structure-evaluator \
            skills/ows-catalyst-recommender \
            skills/round-parallel-synthesis-advisor \
            skills/source-liquid-sop-designer \
            skills/stage08-catalytic-performance-prover \
            skills/stage08-synthesis-safety-feasibility-judge
          sha256sum "$archive" > "$archive.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: coscientist-ows-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  test:
    if: false # Temporarily pause the repository-wide suite; scoped suites run separately.
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - run: uv sync
      - run: uv run pytest -v

  publish:
    needs: [lint, test]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
      - run: npm ci
        working-directory: src/psi_agent/gateway/spa
      - run: npm run build
        working-directory: src/psi_agent/gateway/spa
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
