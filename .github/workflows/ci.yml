name: CI

on:
  push:
  pull_request:

jobs:
  generated-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "11"
      - name: Download ANTLR 4.13.2
        run: |
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/antlr-4.13.2-complete.jar" \
            https://www.antlr.org/download/antlr-4.13.2-complete.jar
          echo "eae2dfa119a64327444672aff63e9ec35a20180dc5b8090b7a6ab85125df4d76  $RUNNER_TEMP/antlr-4.13.2-complete.jar" \
            | sha256sum --check
      - name: Verify FusionFlow generated sources
        working-directory: examples/haitun-workspace/skills/fusion-flow-next
        run: |
          output="$RUNNER_TEMP/fusion-flow-generated"
          mkdir "$output"
          java -jar "$RUNNER_TEMP/antlr-4.13.2-complete.jar" \
            -Dlanguage=Python3 -no-listener -Xexact-output-dir \
            -o "$output" grammar/FusionFlow.g4
          diff -u fusion_flow_next/generated/FusionFlowLexer.py "$output/FusionFlowLexer.py"
          diff -u fusion_flow_next/generated/FusionFlowParser.py "$output/FusionFlowParser.py"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check .

  test:
    if: false # Temporarily paused; keep CI lint-only.
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - run: uv sync
      - run: uv run pytest -v

  publish:
    needs: [lint, test]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
      - run: npm ci
        working-directory: src/psi_agent/gateway/spa
      - run: npm run build
        working-directory: src/psi_agent/gateway/spa
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
