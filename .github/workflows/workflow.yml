name: Generated Sources

on:
  push:
  pull_request:

jobs:
  antlr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "11"
      - name: Install ANTLR tools
        run: pip install antlr4-tools==0.2.2
      - name: Fetch ANTLR jar
        run: |
          mkdir -p "$HOME/.antlr"
          jar="$HOME/.antlr/antlr4-4.13.2-complete.jar"
          for url in \
            "https://github.com/antlr/antlr4/releases/download/4.13.2/antlr4-4.13.2-complete.jar" \
            "https://repo1.maven.org/maven2/org/antlr/antlr4/4.13.2/antlr4-4.13.2-complete.jar" \
            "https://repo.maven.apache.org/maven2/org/antlr/antlr4/4.13.2/antlr4-4.13.2-complete.jar" \
            "https://www.antlr.org/download/antlr-4.13.2-complete.jar"; do
            if curl -fsSL --retry 5 --connect-timeout 15 -o "$jar" "$url"; then
              echo "ANTLR jar downloaded from $url"
              break
            fi
          done
          test -s "$jar"
      - name: Verify Workflow generated sources
        working-directory: examples/haitun-workspace/skills/workflow
        run: |
          output="$RUNNER_TEMP/workflow-generated"
          mkdir "$output"
          antlr4 -v 4.13.2 \
            -Dlanguage=Python3 -no-listener -Xexact-output-dir \
            -o "$output" grammar/FusionFlow.g4
          diff -u fusion_flow/generated/FusionFlowLexer.py "$output/FusionFlowLexer.py"
          diff -u fusion_flow/generated/FusionFlowParser.py "$output/FusionFlowParser.py"
