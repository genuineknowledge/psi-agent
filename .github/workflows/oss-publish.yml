name: Publish Haitun Installer to OSS

# 发布通道的上游是 PyInstaller, 不是 Nuitka: 全链 17 min vs 2 h, 产物对发版是
# 等价的 (launcher 硬编码 `psi-agent.exe`, 两个 builder 都往同一路径拷)。
#
# `branches` 过滤的是上游 run 的 head branch, 所以 PR / 特性分支上的 PyInstaller
# run 根本不会触发这条流水线。下面 job 级的 `head_branch == 'main'` 判断保留着做
# 第二道闸 —— 两道都在, 触发面窄了, 误发的防线也没减。
on:
  workflow_run:
    workflows:
      - PyInstaller
    types:
      - completed
    branches:
      - main
      - "v*"

permissions:
  contents: read
  actions: read

concurrency:
  group: haitun-oss-publish
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.head_branch == 'main' ||
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Check haitun.iss changed in this commit
        id: changed
        shell: bash
        run: |
          if git diff-tree --no-commit-id --name-only -r -m \
            "${{ github.event.workflow_run.head_sha }}" | grep -qx '.github/inno-setup/haitun.iss'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::haitun.iss was not changed; upload only runs if OSS version differs"
          fi

      - name: Read installer version
        id: metadata
        shell: bash
        run: |
          VERSION="$(sed -n 's/^#define[[:space:]]\+MyAppVersion[[:space:]]\+"\([^"]*\)".*/\1/p' .github/inno-setup/haitun.iss)"
          if [ -z "$VERSION" ]; then
            echo "::error::Cannot parse MyAppVersion from .github/inno-setup/haitun.iss"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Compare OSS version
        id: check
        shell: bash
        env:
          HAITUN_DOWNLOAD_BASE_URL: ${{ vars.HAITUN_DOWNLOAD_BASE_URL }}
          NEXT_VERSION: ${{ steps.metadata.outputs.version }}
          CHANGED: ${{ steps.changed.outputs.changed }}
        run: |
          if [ "$CHANGED" = "true" ]; then
            echo "::notice::haitun.iss changed in this commit; publishing installer"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$HAITUN_DOWNLOAD_BASE_URL" ]; then
            echo "::warning::HAITUN_DOWNLOAD_BASE_URL is not set; uploading without OSS version comparison"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          URL="${HAITUN_DOWNLOAD_BASE_URL%/}/haitun-version.txt"
          CODE="$(curl -fsS -o /tmp/oss-version.txt -w '%{http_code}' "$URL" || true)"
          if [ "$CODE" = "200" ]; then
            CURRENT="$(tr -d '[:space:]' < /tmp/oss-version.txt)"
            if [ -n "$CURRENT" ] && [ "$CURRENT" = "$NEXT_VERSION" ]; then
              echo "::notice::OSS is already at $NEXT_VERSION; skipping upload"
              echo "skip=true" >> "$GITHUB_OUTPUT"
            else
              echo "::notice::OSS version (${CURRENT:-missing}) differs from $NEXT_VERSION; publishing"
              echo "skip=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "::notice::OSS haitun-version.txt not available (HTTP ${CODE:-unknown}); publishing"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download installer artifact
        if: steps.check.outputs.skip != 'true'
        uses: actions/download-artifact@v8
        with:
          name: haitun-agent-installers
          path: installer
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # macOS 的 dmg 来自**同一个 workflow run** (pyinstaller.yml 的
      # `haitun-macos-dmg` job), 所以能共用 run-id 一次取到。
      #
      # dmg 和版本号是**两个 artifact**: `haitun-agent-macos` 是给人下载去装的,
      # 里面只该有安装包; 版本号是流水线自己用的元数据, 走
      # `haitun-agent-macos-version`。两个都下到同一个目录, 下游路径不变。
      #
      # 这里刻意不设 `continue-on-error`: 两平台共用 `haitun-version.txt`,
      # 而这个文件是发布闸门 (OSS 版本 == 本次版本 → 跳过上传)。若 mac 缺席也
      # 照发, 版本文件会被写成新版, 下一次 run 就把 macOS 永久闸掉 —— 于是
      # "mac 这次没编出来"静默退化成"mac 再也发不出去"。宁可整条 publish 红。
      - name: Download macOS artifact
        if: steps.check.outputs.skip != 'true'
        uses: actions/download-artifact@v8
        with:
          name: haitun-agent-macos
          path: installer-macos
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download macOS version metadata
        if: steps.check.outputs.skip != 'true'
        uses: actions/download-artifact@v8
        with:
          name: haitun-agent-macos-version
          path: installer-macos
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # 两平台的版本号都来自 haitun.iss 的 MyAppVersion, 各自独立生成一份版本
      # 文件。对不上说明两个 job 跑在不同 commit 上 (或某一侧解析逻辑漂了),
      # 此时上传会让 OSS 的版本号与其中一个平台的产物不符。
      - name: Verify both platforms agree on the version
        if: steps.check.outputs.skip != 'true'
        shell: bash
        env:
          EXPECTED: ${{ steps.metadata.outputs.version }}
        run: |
          WIN="$(tr -d '[:space:]' < installer/haitun-version.txt)"
          MAC="$(tr -d '[:space:]' < installer-macos/haitun-version.txt)"
          if [ "$WIN" != "$EXPECTED" ] || [ "$MAC" != "$EXPECTED" ]; then
            echo "::error::version mismatch: iss=$EXPECTED windows=$WIN macos=$MAC"
            exit 1
          fi
          echo "::notice::both platforms at $EXPECTED"

      - name: Read MSYS version
        if: steps.check.outputs.skip != 'true'
        id: msys-version
        shell: bash
        run: |
          MSYS="$(tr -d '[:space:]' < installer/msys-version.txt)"
          echo "msys=$MSYS" >> "$GITHUB_OUTPUT"

      - name: Upload installers and version files to Aliyun OSS
        if: steps.check.outputs.skip != 'true'
        shell: bash
        env:
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
          ALIYUN_OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
          ALIYUN_OSS_ENDPOINT: ${{ secrets.ALIYUN_OSS_ENDPOINT }}
          ALIYUN_OSS_PREFIX: ${{ vars.ALIYUN_OSS_PREFIX }}
          HAITUN_VERSION: ${{ steps.metadata.outputs.version }}
          MSYS_VERSION: ${{ steps.msys-version.outputs.msys }}
          INSTALLER_FULL_PATH: installer/HaiTun_Agent_Setup.exe
          INSTALLER_APP_PATH: installer/HaiTun_Agent_App_Setup.exe
          INSTALLER_MSYS_PATH: installer/msys-setup.exe
          INSTALLER_MACOS_PATH: installer-macos/HaiTun_Agent.dmg
          HAITUN_VERSION_FILE: installer/haitun-version.txt
          MSYS_VERSION_FILE: installer/msys-version.txt
        run: |
          python3 -m pip install --quiet oss2
          python3 .github/inno-setup/upload_to_oss.py
