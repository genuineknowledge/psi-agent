[project]
name = "guoshu-weekly-bff"
version = "0.1.0"
description = "BFF for the guoshu-weekly frontend: session auth, identity mapping, key injection, SSE passthrough"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "itsdangerous>=2.2",
    "mcp>=1.20",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "reportlab>=4.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
